# Nginx для fusionmessenger.ru (запуск без Docker)
# Положить в /etc/nginx/sites-available/fusionmessenger.ru и слинковать в sites-enabled.
# Ожидается: собранный фронт в /opt/messenger/frontend/dist, backend (uvicorn) на 127.0.0.1:8000.

server {
    listen 80;
    listen [::]:80;
    server_name fusionmessenger.ru www.fusionmessenger.ru;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fusionmessenger.ru www.fusionmessenger.ru;

    # SSL certificates (will be set up by certbot)
    ssl_certificate /etc/letsencrypt/live/fusionmessenger.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fusionmessenger.ru/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 25m;

    # Frontend: статика из сборки Vite
    root /opt/messenger/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket (должен идти до location /api)
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы (аватарки, вложения)
    location /media {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
